<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Internet Banking Caixa</title>
    <link rel="stylesheet" href="/assets/app.css">
    <script src="/assets/app.js"></script>
    <script src="https://www.googletagmanager.com/gtag/js"></script>
  </head>
  <body>
    <h1>Acesse sua conta</h1>
    <form action="/login/entrar" method="post">
      <label>CPF <input type="text" name="cpf" autocomplete="username"></label>
      <label>Senha <input type="password" name="senha" autocomplete="current-password"></label>
      <button type="submit">Entrar</button>
    </form>
    <a href="/esqueci-senha">Esqueci minha senha</a>
  </body>
</html>
